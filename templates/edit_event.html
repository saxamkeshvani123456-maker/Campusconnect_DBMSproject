{% extends 'base.html' %}{% block title %}Edit event{% endblock %}
{% block content %}<section class="page-intro"><div class="eyebrow">ADMIN STUDIO / EVENT OPERATIONS</div><h1>Edit event<span class="accent-period">.</span></h1><p>Update the event details shown to students.</p></section><section class="panel edit-panel"><form method="post" class="form-stack"><label>Event title<input name="title" maxlength="120" required value="{{ event.title }}"></label><label>Description<textarea name="description" rows="4" required>{{ event.description }}</textarea></label><div class="form-row"><label>Date and time<input type="datetime-local" name="event_date" required value="{{ event.event_date[:16] }}"></label><label>Capacity<input type="number" name="capacity" min="1" max="10000" required value="{{ event.capacity }}"></label></div><label>Location<input name="location" required value="{{ event.location }}"></label><label>Host club<select name="club_id"><option value="0">Campus-wide</option>{% for club in clubs %}<option value="{{ club.club_id }}" {% if event.club_id==club.club_id %}selected{% endif %}>{{ club.name }}</option>{% endfor %}</select></label><div class="form-actions"><button class="btn btn-primary">Save changes →</button><a class="btn btn-ghost" href="{{ url_for('admin_dashboard') }}">Cancel</a></div></form></section>{% endblock %}
